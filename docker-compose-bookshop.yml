services:

  cache-redis:
    image: bitnami/redis
    environment:
      REDIS_PORT_NUMBER: 6379
      ALLOW_EMPTY_PASSWORD: yes
    ports:
      - 6379:6379
    healthcheck:
      test: [ "CMD", "redis-cli", "-h", "localhost", "ping" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bookshop_network

  database:
    image: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-upsa}
      POSTGRES_USER: ${POSTGRES_USER:-system}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
    networks:
      - bookshop_network

  flyway:
    image: flyway/flyway
    volumes:
      - ./common/flyway:/flyway/db
    environment:
      FLYWAY_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-upsa}
      FLYWAY_USER: ${POSTGRES_USER:-system}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/db
      FLYWAY_CLEAN_DISABLED: false
    command: ["clean", "migrate"]
    depends_on:
      - database
    networks:
      - bookshop_network

  ws_authors:
    build:
      context: ./ws_authors
      dockerfile: ./docker/Dockerfile
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-upsa}
      DATABASE_USERNAME: ${POSTGRES_USER:-system}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 8081:8080
    healthcheck:
      test: wget -qO- http://localhost:8080/health/live || exit 1
      interval: 10s
      retries: 3
      timeout: 5s
    depends_on:
      - flyway
    networks:
      - bookshop_network

  ws_books:
    build:
      context: ./ws_books
      dockerfile: ./docker/Dockerfile
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-upsa}
      DATABASE_USERNAME: ${POSTGRES_USER:-system}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 8082:8080
    healthcheck:
      test: wget -qO- http://localhost:8080/health/live || exit 1
      interval: 10s
      retries: 3
      timeout: 5s
    depends_on:
      ws_authors:
        condition: service_healthy
    networks:
      - bookshop_network

  gateway:
    build:
      context: ./gateway
      dockerfile: ./docker/Dockerfile.jvm
    environment:
      REDIS_HOST: redis://cache-redis:6379
      REDIS_TYPE: standalone
      AUTHORS_REMOTE_API_MP_REST_URI: http://ws_authors:8080/
      BOOKS_REMOTE_API_MP_REST_URI: http://ws_books:8080/
    ports:
      - 8888:8080
    healthcheck:
      test: curl -f http://localhost:8080/q/health/live || exit 1
      interval: 10s
      retries: 3
      timeout: 5s
    depends_on:
      ws_books:
        condition: service_healthy
      cache-redis:
        condition: service_healthy
    networks:
      - bookshop_network

networks:
  bookshop_network:

volumes:
  pgdata: {}